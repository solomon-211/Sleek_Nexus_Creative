name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # The API is deployed separately (see backend/README.md), but its tests
      # gate this workflow so a broken form endpoint is caught on every push.
      - name: Test backend
        working-directory: backend
        run: |
          npm ci
          npm test

      - name: Install dependencies
        working-directory: frontend-react
        run: npm ci

      - name: Lint
        working-directory: frontend-react
        run: npm run lint

      - name: Build
        working-directory: frontend-react
        run: npm run build
        env:
          VITE_EMAILJS_SERVICE_ID: ${{ secrets.VITE_EMAILJS_SERVICE_ID }}
          VITE_EMAILJS_CONTACT_TEMPLATE_ID: ${{ secrets.VITE_EMAILJS_CONTACT_TEMPLATE_ID }}
          VITE_EMAILJS_NEWSLETTER_TEMPLATE_ID: ${{ secrets.VITE_EMAILJS_NEWSLETTER_TEMPLATE_ID }}
          VITE_EMAILJS_PUBLIC_KEY: ${{ secrets.VITE_EMAILJS_PUBLIC_KEY }}
          VITE_API_URL: ${{ vars.VITE_API_URL }}
          # Optional. Leave unset to ship with no analytics and no cookie banner.
          VITE_GA_MEASUREMENT_ID: ${{ vars.VITE_GA_MEASUREMENT_ID }}
          # Optional. Set to "true" to publish the team section on the About page.
          VITE_SHOW_TEAM: ${{ vars.VITE_SHOW_TEAM }}

      - name: Copy CNAME to dist
        run: cp CNAME frontend-react/dist/CNAME

      - uses: actions/configure-pages@v4

      - uses: actions/upload-pages-artifact@v3
        with:
          path: frontend-react/dist

      - uses: actions/deploy-pages@v4
        id: deployment
